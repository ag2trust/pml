pml: "0.1-draft"

project:
  id: alternative_outcome_sample
  name: Alternative Outcome Sample
  purpose: Demonstrate successful outcome alternatives and authored failures.

concepts:
  inbound_email:
    meaning: A received email awaiting an importance decision.

domains:
  email:
    purpose: Manage inbound email.
    features:
      triage:
        purpose: Classify inbound email by importance.
        behaviors:
          importance_decision:
            conditions:
              - The inbound email has content and a sender.
            trigger:
              one_of:
                received:
                  statement: The product receives an inbound email for triage.
                requested_again:
                  statement: A Member requests another importance decision for the inbound email.
            outcome:
              one_of:
                important:
                  statement: The inbound email is classified as important.
                  signal:
                    id: important_email_processed
                    subject: inbound_email
                    meaning: An inbound email has been classified as important.
                ordinary:
                  statement: The inbound email is classified as ordinary.
                  signal:
                    id: ordinary_email_processed
                    subject: inbound_email
                    meaning: An inbound email has been classified as ordinary.
            failures:
              processing_failure:
                statement: A visible failure indicates that a complete importance decision could not be supported.
                signal:
                  id: email_processing_failed
                  subject: inbound_email
                  meaning: An inbound email could not receive a supported importance decision.
