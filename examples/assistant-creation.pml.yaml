pml: "0.1-draft"

project:
  id: example_product
  name: Example Product
  purpose: Demonstrate the proposed PML grammar.

vocabulary:
  Customer:
    meaning: An organization that owns product resources.
    forbidden_synonyms:
      - tenant
      - client
  Member:
    meaning: An authenticated person belonging to one Customer.
    forbidden_synonyms:
      - user
  Assistant:
    meaning: A Customer-owned AI worker configured by a Member.

actors:
  member:
    meaning: An authenticated person belonging to one Customer.

concepts:
  assistant:
    meaning: A Customer-owned AI worker configured by a Member.
    states:
      - draft
      - active
      - paused
      - retired

domains:
  assistants:
    purpose: Allow Members to create and operate Assistants.

    features:
      creation:
        purpose: Allow a Member to create a usable Assistant.
        actors:
          - member

        rules:
          ownership:
            statement: A Member MUST create an Assistant only for the Member's Customer.
          atomic_failure:
            statement: WHEN creation fails, THE SYSTEM MUST leave no partial Assistant.
          entitlement:
            statement: A Member MUST enable only capabilities available to the Member's Customer.
          customer_ownership:
            statement: Customer ownership MUST be enforced for every affected resource.
          credentials_not_exposed:
            statement: Credentials MUST NOT be exposed to the browser.

        behaviors:
          assistant_creation:
            conditions:
              - The Member is authenticated and may create another Assistant.
            trigger:
              statement: The Member provides valid configuration and requests creation.
            outcome:
              statement: The Assistant is created for the Member's Customer and can respond to a message.
              signal:
                id: assistant_created
                subject: assistant
                meaning: A usable Assistant has been created successfully.
            failures:
              rejected:
                statement: No partial Assistant remains and the Member receives an actionable explanation.
          created_assistant_visibility:
            trigger:
              signal: assistant_created
            outcome:
              statement: The created Assistant appears in the Assistant list without a new login.

        use_cases:
          create_from_scratch:
            actor: member
            goal: Create and begin using an Assistant.
            behaviors:
              - domains.assistants.features.creation.behaviors.assistant_creation
              - domains.assistants.features.creation.behaviors.created_assistant_visibility
        experience:
          surfaces:
            creation_flow:
              contains:
                - Assistant identity input.
                - Operating instructions input.
                - Capability selection.
                - Creation action.
              states:
                submitting:
                  - Progress MUST be visible.
                  - Duplicate submission MUST be prevented.
                failure:
                  - Entered information MUST be preserved.
                  - A retry action MUST be available.
