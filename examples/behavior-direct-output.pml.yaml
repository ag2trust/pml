pml: "0.1-draft"

project:
  id: direct_outcome_sample
  name: Direct Outcome Sample
  purpose: Demonstrate one complete behavior outcome.

concepts:
  inbound_email:
    meaning: A received email awaiting an importance decision.

domains:
  email:
    purpose: Manage inbound email.
    features:
      triage:
        purpose: Classify inbound email by importance.
        behaviors:
          importance_decision:
            conditions:
              - The inbound email has content and a sender.
            trigger:
              statement: The product receives an inbound email for triage.
            outcome:
              statement: One complete importance decision classifying the inbound email as important or ordinary.
              signal:
                id: email_processed
                subject: inbound_email
                meaning: An inbound email has received a complete importance decision.
