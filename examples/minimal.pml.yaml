pml: "0.1-draft"

project:
  id: sample_product
  name: Sample Product
  purpose: Help a Member record durable Notes.

actors:
  member:
    meaning: A person authorized to use the product.

domains:
  notes:
    purpose: Allow Members to manage Notes.
    features:
      creation:
        purpose: Allow a Member to create a Note.
        actors:
          - member
        rules:
          preserve_content:
            statement: THE SYSTEM MUST preserve accepted Note content.
        behaviors:
          note_creation:
            conditions:
              - The Member is authorized.
            trigger:
              statement: The Member submits Note content.
            outcome:
              statement: The Note is available in a later session.
            failures:
              rejected:
                statement: The Member receives an actionable explanation and no Note is created.
        use_cases:
          create_note:
            actor: member
            goal: Record information for later use.
            behaviors:
              - domains.notes.features.creation.behaviors.note_creation
