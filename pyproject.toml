[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-manifest-language"
version = "0.1.0"
description = "Validator for the Product Manifest Language"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pml = "pml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

