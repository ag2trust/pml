pml: "0.1-draft"

project:
  id: pml
  name: Product Manifest Language
  purpose: >-
    Provide a predictable natural-language programming format through which people
    and agents can agree on a product, build it, detect gaps, and monitor continued
    conformance.

actors:
  owner:
    meaning: The person with authority to approve product intent.
  authoring_agent:
    meaning: An agent that proposes or updates a product definition.
  verification_agent:
    meaning: An independent agent that evaluates product conformance.

domains:
  language:
    purpose: Define and validate PML programs.

    features:
      definition_authoring:
        purpose: Express product intent using a small and predictable grammar.

        rules:
          controlled_structure:
            statement: An Authoring Agent MUST use only language-defined sections and fields.
          stable_terms:
            statement: Each product concept MUST have one canonical term and one stable identifier.
          implementation_independence:
            statement: A product definition MUST describe required behavior without prescribing code organization.
          approval_boundary:
            statement: An Agent MUST NOT change approved product intent without Owner approval.
          accepted_definition_is_valid:
            statement: Every accepted definition MUST pass structural and semantic validation.
          invalid_definition_has_diagnostics:
            statement: Invalid definitions MUST identify each detected violation.

        behaviors:
          definition_validation:
            trigger:
              statement: An Authoring Agent submits a PML definition for validation.
            outcome:
              statement: The accepted definition uses canonical constructs and every reference resolves.
            failures:
              invalid_definition:
                statement: The definition is rejected and each detected violation is identified precisely.

        use_cases:
          define_product:
            actor: authoring_agent
            goal: Convert agreed product intent into a valid PML definition.
            behaviors:
              - domains.language.features.definition_authoring.behaviors.definition_validation
      conformance_monitoring:
        purpose: Determine whether a product continues to satisfy its approved definition.

        rules:
          independent_evidence:
            statement: A Verification Agent MUST derive conformance from observable evidence.
          stale_verification:
            statement: A change to a referenced product behavior MUST invalidate that behavior's verification state.
          no_self_redefinition:
            statement: Failed conformance MUST NOT be resolved by automatically weakening the approved definition.
          protected_probes:
            statement: An Agent MUST NOT change an approved probe definition without Owner approval.
          replayable_judgment:
            statement: An agent judgment MUST include reproduction steps that allow independent replay.
          passing_verdict_has_evidence:
            statement: Every passing verdict MUST reference current observable evidence.
          failed_conformance_has_gap:
            statement: Failed conformance MUST produce an evidence-backed gap.

        behaviors:
          conformance_evaluation:
            conditions:
              - The product definition is approved.
            trigger:
              statement: A Verification Agent evaluates current evidence against the product graph.
            outcome:
              statement: Every evaluated obligation receives an evidence-backed typed state.
            failures:
              insufficient_evidence:
                statement: Missing evidence produces an unknown or stale state and is not reported as passing.

        use_cases:
          evaluate_conformance:
            actor: verification_agent
            goal: Determine whether the current product conforms to its approved definition.
            behaviors:
              - domains.language.features.conformance_monitoring.behaviors.conformance_evaluation
